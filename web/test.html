<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switchcraft tests</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: 600; }
</style>
</head>
<body>
<h1>Switchcraft page tests</h1>
<pre id="out"></pre>
<script src="switchcraft.js"></script>
<script src="synth.js"></script>
<script>
'use strict';
const S = Switchcraft;
const out = document.getElementById('out');
let failed = 0, passed = 0;

function log(cls, text) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = text + '\n';
  out.append(span);
}
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
async function test(name, fn) {
  try {
    await fn();
    passed++;
    log('pass', 'PASS ' + name);
  } catch (e) {
    failed++;
    log('fail', 'FAIL ' + name + ': ' + e.message);
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEq(a, b) { assert(eq(a, b), `${JSON.stringify(a)} != ${JSON.stringify(b)}`); }
const hex = (n) => n.toString(16).padStart(8, '0');

// A fake board: answers protocol requests like the firmware does.
function fakeBoard() {
  const dev = {
    working: S.buildTable(S.tableFromForm(S.defaultForm())),
    slots: [], staging: null, activeSlot: 0,
  };
  const input = { name: 'MIDIIN2 (Switchcraft)', onmidimessage: null };
  const reply = (m, status, data = []) => setTimeout(() =>
    input.onmidimessage({ data: new Uint8Array(S.encode(m.cmd | 0x40, m.seq, [status, ...data])) }), 1);
  const le16 = (v) => [v & 0xff, v >> 8];
  const output = {
    name: 'MIDIOUT2 (Switchcraft)',
    send(bytes) {
      const m = S.decode(bytes);
      const p = m.payload;
      const src = (s) => (s === 0xff ? dev.working : dev.slots[s]);
      switch (m.cmd) {
        case S.CMD.IDENTIFY:
          return reply(m, 0, [1, 0, 1, 1, 1, 1, 2, 3, 4, 5, 6, 7, 8, 1, 0, 12, 2, 8, dev.activeSlot, 0xf0, 0x0f, 128, 4]);
        case S.CMD.TABLE_INFO: {
          const b = src(p[0]);
          if (!b) return reply(m, 0x09);
          const c = S.crc32(b);
          return reply(m, 0, [...le16(b.length), c & 0xff, (c >> 8) & 0xff, (c >> 16) & 0xff, c >>> 24, 1, 0]);
        }
        case S.CMD.TABLE_READ: {
          const off = p[1] | (p[2] << 8);
          return reply(m, 0, [p[1], p[2], ...src(p[0]).subarray(off, off + p[3])]);
        }
        case S.CMD.WRITE_BEGIN:
          dev.staging = [];
          return reply(m, 0);
        case S.CMD.WRITE_DATA:
          dev.staging.push(...p.subarray(2));
          return reply(m, 0, le16(dev.staging.length));
        case S.CMD.WRITE_COMMIT:
          dev.working = new Uint8Array(dev.staging);
          if (p[0] & 1) dev.slots[dev.activeSlot] = dev.working;
          return reply(m, 0);
        case S.CMD.SLOT_LOAD:
          if (!dev.slots[p[0]]) return reply(m, 0x09);
          dev.working = dev.slots[p[0]];
          dev.activeSlot = p[0];
          return reply(m, 0);
        default:
          return reply(m, 0x01);
      }
    },
  };
  return { dev, input, output };
}

(async () => {
  await test('encode matches spec example', () => {
    assertEq(S.encode(0x02, 5, [0xff]), [0xf0, 0x7d, 0x53, 0x43, 0x01, 0x02, 0x05, 0x0f, 0x0f, 0xf7]);
  });

  await test('decode spec A.8 worked example', () => {
    const m = S.decode([0xf0, 0x7d, 0x53, 0x43, 0x01, 0x42, 0x05, 0, 0, 3, 4, 0, 1,
      4, 0xd, 3, 0xc, 2, 0xb, 1, 0xa, 0, 1, 0, 0, 0xf7]);
    assertEq([m.cmd, m.seq], [0x42, 5]);
    assertEq(Array.from(m.payload), [0, 0x34, 0x01, 0x4d, 0x3c, 0x2b, 0x1a, 1, 0]);
  });

  await test('decode rejects other manufacturers and odd payloads', () => {
    assert(S.decode([0xf0, 0x7e, 0x53, 0x43, 1, 2, 3, 0xf7]) === null);
    assert(S.decode([0xf0, 0x7d, 0x53, 0x43, 1, 2, 3, 4, 0xf7]) === null);
  });

  await test('crc32 standard check value', () => {
    assertEq(hex(S.crc32(new TextEncoder().encode('123456789'))), 'cbf43926');
  });

  await test('default form builds the firmware\'s built-in table byte for byte', () => {
    const blob = S.buildTable(S.tableFromForm(S.defaultForm()));
    assertEq(blob.length, 228);
    assertEq(hex(S.crc32(blob)), 'b931023f');  // as read back from the board
  });

  await test('form -> table -> form round trip', () => {
    const f = S.defaultForm();
    f.switches[3] = { action: 'note', note: 38, gate: 'oneshot' };
    f.switches[4] = { action: 'none' };
    f.switches[5] = { action: 'scale', degree: -3, gate: 'latch' };
    f.analog[1] = { cc: null };
    f.name = 'Drums';
    const back = S.formFromTable(S.parseTable(S.buildTable(S.tableFromForm(f))));
    assert(back.form, back.reason);
    assertEq(back.form.switches, f.switches);
    assertEq(back.form.analog, f.analog);
    assertEq(back.form.name, 'Drums');
  });

  await test('tables the form can\'t show are recognised', () => {
    const t = S.tableFromForm(S.defaultForm());
    t.rules.push({ trig: S.TRIG.TAP, src: 0, act: S.ACT.PRESET, p0: 1 });
    const r = S.formFromTable(S.parseTable(S.buildTable(t)));
    assert(!r.form && /tap/.test(r.reason), JSON.stringify(r));
    const t2 = S.tableFromForm(S.defaultForm());
    t2.rules.push(t2.rules[0]);  // two rules on one switch
    assert(!S.formFromTable(S.parseTable(S.buildTable(t2))).form);
  });

  await test('scale degrees match the notes the board played', () => {
    const major = Array.from({ length: 10 }, (_, d) => S.degreeToNote(d, 0, 4, 0x0ab5));
    assertEq(major, [60, 62, 64, 65, 67, 69, 71, 72, 74, 76]);
    assertEq(S.degreeToNote(-7, 0, 4, 0x0ab5), 48);   // demo drone
    assertEq(S.degreeToNote(2, 0, 4, 0x05ad), 63);    // E flat in C minor
    assertEq(S.degreeToNote(-1, 0, 4, 0x0ab5), 59);
    assertEq(S.noteName(63), 'E♭4');
  });

  await test('Board.find picks the port pair that answers IDENTIFY', async () => {
    const { input, output } = fakeBoard();
    const silentOut = { name: 'Switchcraft', send() {} };
    const silentIn = { name: 'Switchcraft', onmidimessage: null };
    const access = { outputs: new Map([[1, silentOut], [2, output]]), inputs: new Map([[1, silentIn], [2, input]]) };
    const board = await S.Board.find(access);
    assert(board && board.output === output && board.input === input, 'wrong ports');
    assertEq(board.info.firmware, '0.1.1');
    assertEq(board.info.uniqueId, '0102030405060708');
  });

  await test('write, read back and save a table through the fake board', async () => {
    const { dev, input, output } = fakeBoard();
    const board = new S.Board(input, output);
    const f = S.defaultForm();
    f.name = 'Test';
    const blob = S.buildTable(S.tableFromForm(f));
    await board.writeTable(blob, true);
    assertEq(Array.from(await board.readTable()), Array.from(blob));
    assertEq(Array.from(dev.slots[0]), Array.from(blob));
  });

  await test('concurrent requests are queued, not interleaved', async () => {
    const { input, output } = fakeBoard();
    const board = new S.Board(input, output);
    const results = await Promise.all([board.tableInfo(0xff), board.identify(), board.tableInfo(0xff)]);
    assertEq(results[0].length, 228);
    assertEq(results[1].activeSlot, 0);
  });

  await test('error replies become BoardErrors with the status', async () => {
    const { input, output } = fakeBoard();
    const board = new S.Board(input, output);
    try {
      await board.loadSlot(5);
      throw new Error('no error');
    } catch (e) {
      assert(e instanceof S.BoardError && e.status === 0x09, e.message);
    }
  });

  await test('reports are delivered to callbacks', async () => {
    const { input, output } = fakeBoard();
    const board = new S.Board(input, output);
    const seen = [];
    board.onInput = (i, ev) => seen.push([i, ev]);
    board.onMidi = (d) => seen.push(Array.from(d));
    input.onmidimessage({ data: new Uint8Array(S.encode(0x60, 0, [7, 4])) });
    input.onmidimessage({ data: new Uint8Array([0x90, 60, 100]) });
    assertEq(seen, [[7, 'tap'], [0x90, 60, 100]]);
  });

  const toHex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

  await test('sequence sections match tools/sc.py byte for byte', () => {
    const arp = { id: 0, advance: 1, order: 3, octaves: 2, channel: 0xff, velocity: 0, division: 6, gate: 60,
      noteMode: 1, steps: [0, 2, 4].map((n) => ({ note: n, velocity: 0, rest: false, length: 1 })) };
    const tune = { id: 1, advance: 0, order: 0, octaves: 1, channel: 0xff, velocity: 0, division: 6, gate: 0,
      noteMode: 0, steps: [0, 0, 4, null, 3].map((n) => ({ note: n || 0, velocity: 0, rest: n === null, length: 1 })) };
    const g = S.tableFromForm(S.defaultForm()).globals;
    const blob = S.buildTable({ globals: g, rules: [], sequences: [arp, tune] });
    const hexBlob = toHex(blob);
    // Reference bytes printed by tools/sc.py sequence_section().
    assert(hexBlob.includes('0300150000010302ff00063c01000300000001020001040001'), 'arp');
    assert(hexBlob.includes('03001b0001000001ff00060000000500000001000001040001000081030001'), 'tune');
  });

  // A form using every sequence feature the page offers.
  function sequenceForm() {
    const f = S.defaultForm();
    f.name = 'Sequences';
    f.tempo = 900;
    f.sequences[0] = { mode: 'clock', noteType: 'scale', notes: [0, 2, 4], order: 'updown', octaves: 2, division: 6, gate: 60 };
    f.sequences[1] = { mode: 'press', noteType: 'scale', notes: [0, 0, 4, 4, 5, 5, 4, null], order: 'written', octaves: 1, division: 6, gate: 0 };
    f.sequences[2] = { mode: 'clock', noteType: 'fixed', notes: [36, null, 38, 36, 42, 42, null, 38], order: 'random', octaves: 1, division: 12, gate: 25 };
    f.sequences[3] = { mode: 'clock', noteType: 'scale',
      notes: Array.from({ length: S.MAX_FORM_STEPS }, (_, i) => (i % 7 === 6 ? null : i - 7)),
      order: 'down', octaves: 4, division: 3, gate: 100 };
    f.switches[0] = { action: 'seq-play', seq: 0, gate: 'hold', onBeat: false };
    f.switches[1] = { action: 'seq-play', seq: 2, gate: 'latch', onBeat: true };
    f.switches[2] = { action: 'seq-play', seq: 3, gate: 'oneshot', onBeat: false };
    f.switches[3] = { action: 'seq-step', seq: 1 };
    f.switches[4] = { action: 'seq-restart', seq: 1 };
    return f;
  }

  await test('sequences and sequence actions round trip through the table', () => {
    const f = sequenceForm();
    const back = S.formFromTable(S.parseTable(S.buildTable(S.tableFromForm(f))));
    assert(back.form, back.reason);
    assertEq(back.form.sequences, f.sequences);
    assertEq(back.form.switches, f.switches);
    assertEq(back.form.tempo, 900);
  });

  await test('switches using an empty sequence send no rule', () => {
    const f = S.defaultForm();
    f.switches[0] = { action: 'seq-play', seq: 1, gate: 'hold', onBeat: false };
    const t = S.tableFromForm(f);
    assert(!t.rules.some((r) => r.src === 0 && r.trig === S.TRIG.PRESS), 'rule sent');
    assertEq(t.sequences.length, 0);
  });

  await test('clock-mode "until next note" becomes full length', () => {
    const f = S.defaultForm();
    f.sequences[0] = { ...S.defaultSequence(), notes: [0], gate: 0 };
    assertEq(S.tableFromForm(f).sequences[0].gate, 100);
  });

  await test('the demo-style "selected sequence" target is not shown in the form', () => {
    const t = S.tableFromForm(sequenceForm());
    t.rules.push({ trig: S.TRIG.PRESS, src: 9, act: S.ACT.SEQ_STEP, p0: 0xff });
    assert(!S.formFromTable(S.parseTable(S.buildTable(t))).form);
  });

  // --- Synth: render offline and measure what comes out ---

  const RATE = 22050;
  function rms(buf, from, to) {
    const d = buf.getChannelData(0).subarray(Math.floor(from * RATE), Math.floor(to * RATE));
    return Math.sqrt(d.reduce((a, x) => a + x * x, 0) / d.length);
  }
  // Energy of the sample-to-sample difference: a rough measure of brightness.
  function edge(buf, from, to) {
    const d = buf.getChannelData(0).subarray(Math.floor(from * RATE), Math.floor(to * RATE));
    let e = 0;
    for (let i = 1; i < d.length; i++) e += (d[i] - d[i - 1]) ** 2;
    return Math.sqrt(e / d.length);
  }
  // events: [[time, midiBytes], ...]
  async function render(seconds, events, setup = () => {}) {
    const ctx = new OfflineAudioContext(1, Math.ceil(seconds * RATE), RATE);
    const synth = new SwitchcraftSynth.Synth(ctx);
    setup(synth);
    for (const [time, msg] of events) {
      if (time === 0) synth.handleMidi(msg);
      else ctx.suspend(time).then(() => { synth.handleMidi(msg); ctx.resume(); });
    }
    return { buf: await ctx.startRendering(), synth };
  }

  await test('synth: a note sounds, then fades after note-off', async () => {
    const { buf } = await render(1.5, [[0, [0x90, 60, 100]], [0.5, [0x80, 60, 0]]]);
    const during = rms(buf, 0.1, 0.45), after = rms(buf, 1.2, 1.5);
    assert(during > 0.02, `quiet while held: ${during}`);
    assert(after < 0.001, `still sounding after release: ${after}`);
  });

  await test('synth: note-on with velocity 0 counts as note-off', async () => {
    const { buf } = await render(1.5, [[0, [0x90, 60, 100]], [0.5, [0x90, 60, 0]]]);
    assert(rms(buf, 1.2, 1.5) < 0.001);
  });

  await test('synth: CC 7 at 0 silences it, CC 123 stops notes', async () => {
    const muted = await render(0.5, [[0, [0xb0, 7, 0]], [0, [0x90, 60, 100]]]);
    assert(rms(muted.buf, 0.1, 0.5) < 0.001, 'CC 7 = 0 not silent');
    const panic = await render(1.2, [[0, [0x90, 60, 100]], [0, [0x90, 64, 100]], [0.3, [0xb0, 123, 0]]]);
    assert(rms(panic.buf, 0.8, 1.2) < 0.001, 'CC 123 left notes on');
  });

  await test('synth: CC 74 makes it brighter', async () => {
    const dark = await render(0.6, [[0, [0xb0, 74, 10]], [0, [0x90, 48, 100]]]);
    const bright = await render(0.6, [[0, [0xb0, 74, 127]], [0, [0x90, 48, 100]]]);
    // Compare brightness relative to loudness, after the filter envelope settles.
    const d = edge(dark.buf, 0.4, 0.6) / rms(dark.buf, 0.4, 0.6);
    const b = edge(bright.buf, 0.4, 0.6) / rms(bright.buf, 0.4, 0.6);
    assert(b > d * 2, `bright ${b.toFixed(3)} vs dark ${d.toFixed(3)}`);
  });

  await test('synth: never more than 16 voices; oldest is reused', async () => {
    const events = Array.from({ length: 20 }, (_, i) => [0, [0x90, 40 + i, 100]]);
    const { synth } = await render(0.2, events);
    assertEq(synth.activeVoices, SwitchcraftSynth.MAX_VOICES);
    assert(!synth.voices.has('0:40') && synth.voices.has('0:59'), 'wrong voice stolen');
  });

  await test('synth: plays every sound without errors', async () => {
    for (const id of Object.keys(SwitchcraftSynth.SOUNDS)) {
      const { buf } = await render(0.4, [[0, [0x90, 60, 100]], [0, [0xb0, 1, 127]], [0, [0xe0, 0, 0x60]]],
        (s) => s.setSound(id));
      assert(rms(buf, 0.05, 0.3) > 0.005, `${id} is silent`);
    }
  });

  // Tables for tools/check_page_tables.py to send to a real board.
  const samples = { default: S.defaultForm(), sequences: sequenceForm() };
  const blobs = document.createElement('pre');
  blobs.id = 'blobs';
  blobs.hidden = true;
  blobs.textContent = Object.entries(samples)
    .map(([name, f]) => `${name} ${toHex(S.buildTable(S.tableFromForm(f)))}`).join('\n');
  document.body.append(blobs);

  log(failed ? 'fail' : 'pass', `\n${passed} passed, ${failed} failed`);
  document.title = failed ? 'FAILED' : 'PASSED';
})();
</script>
</body>
</html>
